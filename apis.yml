name: COR
description: COR (COR Global Ltd., projectcor.com) is an AI-powered management platform
  for advertising and creative agencies that calculates and forecasts project
  profitability while managing finances, resources, projects, tasks, and time
  tracking in one real-time workspace. COR publishes a REST API (JSON or XML) for
  projects, tasks, hours, clients, contracts, transactions, teams, users, and more,
  a separate Resource Allocation API, and an official hosted MCP server so AI clients
  can operate a workspace with natural language. Backed by 500 Global.
